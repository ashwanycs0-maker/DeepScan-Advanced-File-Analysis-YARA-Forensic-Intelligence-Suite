<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPSCAN | Intelligence Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1c2635 0%, #131b26 100%);
            width: 100%;
        }
        .login-card {
            width: 450px;
            padding: 40px;
            background: #1c2635;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: var(--accent-blue);
            letter-spacing: 2px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: #0f1620;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--accent-blue);
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        .login-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .error-msg {
            color: var(--accent-red);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div style="font-size: 3rem; color: var(--accent-blue); margin-bottom: 15px;">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>DEEPSCAN</h2>
            <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.9rem;">ENTER CREDENTIALS FOR ADVANCED FILE ANALYTICS</p>
            
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">AUTHENTICATE</button>
            </form>
            
            <p style="margin-top: 30px; font-size: 0.8rem; color: var(--text-secondary);">
                SYSTEM LOG: Awaiting Authorization...
            </p>
        </div>
    </div>
</body>
</html>
